<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Websockets in Golang</title>
</head>
<body>
    <div class="center">
        <h1>Cool Chat application</h1>
        <h3 id="chat-header">Currently in chat: general</h3>

        <form id="chatroom-selection">
            <label for="chatroom">Chatroom:</label>
            <input type="text" name="chatroom" id="chatroom"><br><br>

            <input type="submit" value="Change chatroom">
        </form>
        <br>
        <textarea  class="message-area" id="chat-messages" readonly name="chatmessages" rows="4" cols="50" 
        placeholder="Welcome to chatroom"></textarea>
        <br>
        <form id="chatroom-message">
            <label for="message">Message:</label>
            <input type="text" name="Message" id="message"><br><br>

            <input type="submit" value="Send Message">
        </form>
    </div>

    <script>

        var selectedChat = "general";
        function changeChatroom() {
                var newchat = document.getElementById("chatroom");

                if(newchat != null && newchat.value != selectedChat) {
                    console.log(newchat)
                }
                return false;
        }

        function sendMessage() {
            var newchat = document.getElementById("message");

            if(newchat != null) {
                console.log(newchat)
            }
            return false;
        }

        window.onload = function(){
            document.getElementById("chatroom-selection").onsubmit = changeChatroom
            document.getElementById("chatroom-message").onsubmit = sendMessage

            if(window["WebSocket"]) {
                console.log("supports websockets")
            }
            else {
                alert("Browser does not websockets")
            }
        }

    </script>
    <style type="text/css">
        body {
            overflow: hidden;
            padding: 0;
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: rgb(66, 56, 56);
        }

        .center {
            margin: auto;
            width: 50%;
            border: 3px solid;
            padding: 10px;
        }
    </style>
</body>
</html>
